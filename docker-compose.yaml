services:
  postgres:
    image: postgres:15-alpine
    container_name: nutrigo-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      #- ./backend/internal/migrations/postgresql/:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrigo_user -d nutrigo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: