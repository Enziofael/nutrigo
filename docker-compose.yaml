services:
  postgres:
    image: postgres:15-alpine
    container_name: nutrigo-postgres
    environment:
      POSTGRES_USER: nutrigo_user
      POSTGRES_PASSWORD: nutrigo_password
      POSTGRES_DB: nutrigo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrigo-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nutrigo_user
      DB_PASSWORD: nutrigo_password
      DB_NAME: nutrigo_db
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend-bot:
    build:
      context: ./frontend-bot
      dockerfile: Dockerfile
    container_name: nutrigo-frontend-bot
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: