syntax = "proto3";

package v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Enziofael/nutrigo/shared/api/grpc/generated/go/v1;v1";

message User {
  int64 id = 1;
  optional string tg_tag = 2;
  optional google.protobuf.Timestamp created_at = 3;
  optional google.protobuf.Timestamp last_messaged_at = 4;
  optional UserStatus status = 5;
  optional string context = 6;
  optional ContextData context_data = 7;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_REQUESTED = 1;
  USER_STATUS_CONFIRMED = 2;
  USER_STATUS_RESTRICTED = 3;
  USER_STATUS_BANNED = 4;
  USER_STATUS_ADMIN = 5;
}

message ContextData {
  int64 message_id = 1;
  int64 focus = 2;
  map<string, string> values = 3;
}

message CreateUserRequest {
  User user = 1;
}

message GetUserRequest {
  int64 id = 1;
}

// Limit:
//  - should be in range [1;100]
//
// Offset:
//  - should be non-negative [0;n]
//
// Filters:
//  - sort: 
//      - {relevance,created_at,last_messaged_at}
//      - default: "relevance"
//  - order:
//      - {DESC,ASC}
//      - default: "DESC"
//  - search: 
//      - string to search by tg_tag
//      - default: ""
//  - field:
//      - {status={value},created_at{>=,<=,>,<,=}{unix time}}+
//      - default: ""
//
message ListUsersRequest {
  uint64 limit = 1;
  uint64 offset = 2;
  repeated Filter filters = 3;
}

message Filter {
  FilterType type = 1;
  string value = 2;
}

enum FilterType {
  FILTER_TYPE_UNSPECIFIED = 0;
  FILTER_TYPE_SORT = 1;
  FILTER_TYPE_ORDER = 2;
  FILTER_TYPE_SEARCH = 3;
  FILTER_TYPE_FIELD = 4;
}

enum Order {
  ORDER_UNSPECIFIED = 0;
  ORDER_ASC = 1;
  ORDER_DESC = 2;
}
