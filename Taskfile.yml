version: '3'

tasks:
  tidy:
    desc: Update all dependencies
    cmds:
      - go work sync
      - cd shared && go mod tidy
      - cd backend && go mod tidy
      - cd frontend-bot && go mod tidy

  bot:
    desc: Build Telegram bot
    cmds:
      - cd frontend-bot && go build -o ../bin/bot.exe ./cmd/bot

  backend:
    desc: Build Backend
    cmds:
      - cd backend && go build -o ../bin/backend.exe ./cmd/api

  desktop:
    desc: Build Desktop app
    cmds:
      - cd frontend-desktop && go build -o ../bin/desktop.exe

  run-bot:
    desc: Run Telegram bot
    cmds:
      - cd frontend-bot && go run ./cmd/main.go

  run-backend:
    desc: Run Backend
    cmds:
      - cd backend && go run ./cmd/api/main.go

  all:
    desc: Build everything
    cmds:
      - task: backend
      - task: bot
      - task: desktop

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  ws-clear:
    desc: Set vscode explorer hide settings to show-all workspace
    cmds:
      - powershell -Command "Copy-Item -Path .vscode\default.json -Destination .vscode\settings.json -Force"

  ws-back:
    desc: Set vscode explorer hide settings to backend workspace
    cmds:
      - powershell -Command "Copy-Item -Path .vscode\backend_workspace.json -Destination .vscode\settings.json -Force"

  ws-bot:
    desc: Set vscode explorer hide settings to bot scenatios workspace
    cmds:
      - powershell -Command "Copy-Item -Path .vscode\scenarios_workspace.json -Destination .vscode\settings.json -Force"

  ws-back-save:
    desc: Saves current settings to backend workspace
    cmds:
      - powershell -Command "Copy-Item -Path .vscode\settings.json -Destination .vscode\backend_workspace.json -Force"

  ws-bot-save:
    desc: Saves current settings to bot workspace
    cmds:
      - powershell -Command "Copy-Item -Path .vscode\settings.json -Destination .vscode\scenarios_workspace.json -Force"